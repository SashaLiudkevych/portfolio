<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Juego - 100 Pasos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; }
        h1, h2, .font-heading { font-family: 'Fredoka', cursive, sans-serif; }

        .cell-green-fill {
            background-color: #10b981 !important;
            color: white !important;
            border-color: #047857 !important;
        }
        .cell-red-fill {
            background-color: #ef4444 !important;
            color: white !important;
            border-color: #b91c1c !important;
        }
        .cell-both-fill {
            background: linear-gradient(135deg, #10b981 50%, #ef4444 50%) !important;
            color: white !important;
            border-color: #1f2937 !important;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-3 sm:p-6 text-slate-800 flex flex-col items-center">

    <!-- Header Section -->
    <header class="text-center max-w-4xl w-full mb-4">
        <h1 class="text-3xl sm:text-4xl font-bold text-slate-700 flex items-center justify-center gap-2">
            🗺️ Tablero de 100 Casillas
        </h1>
        <p class="text-slate-500 font-semibold text-xs sm:text-sm mt-1">
            Escribe los pasos manualmente o usa el modo de pintado para marcar casillas
        </p>
    </header>

    <main class="max-w-4xl w-full flex flex-col gap-5">

        <!-- Selector de Modo de Pintado Manual -->
        <section class="bg-white rounded-2xl p-4 shadow-md border border-slate-200 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2 font-bold text-sm text-slate-600">
                <i class="fa-solid fa-paint-roller text-indigo-500"></i>
                <span>Modo de Pintado Manual:</span>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="setPaintMode('green')" id="mode-green" class="px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-emerald-500 text-white border-2 border-emerald-600 shadow-sm transition-all flex items-center gap-1">
                    🟢 Verde
                </button>
                <button onclick="setPaintMode('red')" id="mode-red" class="px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-slate-100 text-slate-600 border-2 border-slate-200 shadow-sm transition-all flex items-center gap-1">
                    🔴 Rojo
                </button>
                <button onclick="setPaintMode('clear')" id="mode-clear" class="px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-slate-100 text-slate-600 border-2 border-slate-200 shadow-sm transition-all flex items-center gap-1">
                    🧹 Borrar
                </button>
            </div>
        </section>

        <!-- Controles de Equipos -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <!-- Equipo Verde -->
            <div class="bg-white border-2 border-emerald-300 rounded-3xl p-4 shadow-md flex flex-col justify-between gap-3">
                <div class="flex items-center justify-between">
                    <div>
                        <span class="text-xs font-extrabold uppercase text-emerald-600 tracking-wider">Equipo 1</span>
                        <h3 class="text-xl font-extrabold text-emerald-700 font-heading">🟢 Verde</h3>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-semibold text-slate-400 block">Casilla Actual</span>
                        <span id="green-pos" class="text-2xl font-extrabold text-emerald-600 font-heading">0</span>
                    </div>
                </div>

                <!-- Entrada Manual de Pasos -->
                <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
                    <input type="number" id="input-green" placeholder="Ej: 5 o -2" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold text-slate-700 focus:outline-none focus:border-emerald-500">
                    <button onclick="applyCustomSteps('green')" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-sm rounded-xl shadow-md transition-all active:scale-95 flex items-center gap-1 shrink-0">
                        Avanzar <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>

            <!-- Equipo Rojo -->
            <div class="bg-white border-2 border-red-300 rounded-3xl p-4 shadow-md flex flex-col justify-between gap-3">
                <div class="flex items-center justify-between">
                    <div>
                        <span class="text-xs font-extrabold uppercase text-red-600 tracking-wider">Equipo 2</span>
                        <h3 class="text-xl font-extrabold text-red-700 font-heading">🔴 Rojo</h3>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-semibold text-slate-400 block">Casilla Actual</span>
                        <span id="red-pos" class="text-2xl font-extrabold text-red-600 font-heading">0</span>
                    </div>
                </div>

                <!-- Entrada Manual de Pasos -->
                <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
                    <input type="number" id="input-red" placeholder="Ej: 5 o -2" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold text-slate-700 focus:outline-none focus:border-red-500">
                    <button onclick="applyCustomSteps('red')" class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white font-bold text-sm rounded-xl shadow-md transition-all active:scale-95 flex items-center gap-1 shrink-0">
                        Avanzar <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>

        </section>

        <!-- Grid de 100 Casillas -->
        <section class="bg-white rounded-3xl p-4 sm:p-6 shadow-xl border border-slate-200">
            
            <div class="flex justify-between items-center mb-3">
                <span class="text-xs font-extrabold text-slate-400 uppercase tracking-widest">Inicio (1)</span>
                <button onclick="resetBoard()" class="px-3 py-1 bg-slate-200 hover:bg-slate-300 rounded-xl text-xs font-bold text-slate-600 transition-all flex items-center gap-1">
                    <i class="fa-solid fa-rotate-left"></i> Limpiar Todo
                </button>
                <span class="text-xs font-extrabold text-amber-500 uppercase tracking-widest">Meta (100) 🏆</span>
            </div>

            <!-- Matriz 10x10 -->
            <div id="board-grid" class="grid grid-cols-5 sm:grid-cols-10 gap-1.5 sm:gap-2">
                <!-- Se generan dinámicamente las 100 casillas -->
            </div>
        </section>

    </main>

    <footer class="text-xs text-slate-400 mt-6 pb-2 text-center">
        Tablero Manual de 100 Pasos • Juego de Mesa
    </footer>

    <!-- JavaScript Logic -->
    <script>
        let currentPaintMode = 'green';
        let greenPosition = 0;
        let redPosition = 0;
        
        const manualFills = Array(101).fill(null);

        function setPaintMode(mode) {
            currentPaintMode = mode;
            ['green', 'red', 'clear'].forEach(m => {
                const btn = document.getElementById(`mode-${m}`);
                if (m === mode) {
                    btn.className = m === 'green' 
                        ? 'px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-emerald-500 text-white border-2 border-emerald-600 shadow-sm transition-all flex items-center gap-1'
                        : m === 'red'
                        ? 'px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-red-500 text-white border-2 border-red-600 shadow-sm transition-all flex items-center gap-1'
                        : 'px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-slate-700 text-white border-2 border-slate-800 shadow-sm transition-all flex items-center gap-1';
                } else {
                    btn.className = 'px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-slate-100 text-slate-600 border-2 border-slate-200 shadow-sm transition-all flex items-center gap-1';
                }
            });
        }

        function createBoard() {
            const grid = document.getElementById('board-grid');
            grid.innerHTML = '';

            for (let i = 1; i <= 100; i++) {
                const cell = document.createElement('div');
                cell.id = `cell-${i}`;
                cell.onclick = () => toggleCellFill(i);
                grid.appendChild(cell);
            }
            updateBoardUI();
        }

        function toggleCellFill(index) {
            if (currentPaintMode === 'clear') {
                manualFills[index] = null;
            } else if (currentPaintMode === 'green') {
                manualFills[index] = manualFills[index] === 'green' ? null : (manualFills[index] === 'red' ? 'both' : 'green');
            } else if (currentPaintMode === 'red') {
                manualFills[index] = manualFills[index] === 'red' ? null : (manualFills[index] === 'green' ? 'both' : 'red');
            }
            updateBoardUI();
        }

        // Застосування вписаних кроків
        function applyCustomSteps(team) {
            const inputEl = document.getElementById(`input-${team}`);
            const steps = parseInt(inputEl.value, 10);

            if (isNaN(steps)) return;

            if (team === 'green') {
                greenPosition = Math.max(0, Math.min(100, greenPosition + steps));
                document.getElementById('green-pos').textContent = greenPosition;
            } else {
                redPosition = Math.max(0, Math.min(100, redPosition + steps));
                document.getElementById('red-pos').textContent = redPosition;
            }

            inputEl.value = ''; // Очистити поле після введення
            updateBoardUI();
        }

        function updateBoardUI() {
            for (let i = 1; i <= 100; i++) {
                const cell = document.getElementById(`cell-${i}`);
                const isMilestone = i % 10 === 0;
                const isFinish = i === 100;

                let baseClasses = 'relative aspect-square rounded-xl border-2 font-bold text-xs sm:text-sm flex flex-col items-center justify-center cursor-pointer transition-all select-none hover:scale-105 shadow-sm ';

                if (manualFills[i] === 'green') {
                    cell.className = baseClasses + 'cell-green-fill';
                } else if (manualFills[i] === 'red') {
                    cell.className = baseClasses + 'cell-red-fill';
                } else if (manualFills[i] === 'both') {
                    cell.className = baseClasses + 'cell-both-fill';
                } else {
                    if (isFinish) {
                        cell.className = baseClasses + 'bg-amber-100 border-amber-400 text-amber-800';
                    } else if (isMilestone) {
                        cell.className = baseClasses + 'bg-amber-50 border-amber-300 text-amber-700';
                    } else {
                        cell.className = baseClasses + 'bg-slate-50 border-slate-200 text-slate-600';
                    }
                }

                let cellContent = `<span>${i}</span>`;
                const hasGreen = greenPosition === i;
                const hasRed = redPosition === i;

                if (hasGreen && hasRed) {
                    cellContent += `<span class="text-xs leading-none mt-0.5">🟢🔴</span>`;
                } else if (hasGreen) {
                    cellContent += `<span class="text-xs leading-none mt-0.5">🟢</span>`;
                } else if (hasRed) {
                    cellContent += `<span class="text-xs leading-none mt-0.5">🔴</span>`;
                } else if (isFinish && !manualFills[i]) {
                    cellContent = `<span class="text-base">🏆</span><span class="text-[10px]">100</span>`;
                }

                cell.innerHTML = cellContent;
            }
        }

        function resetBoard() {
            manualFills.fill(null);
            greenPosition = 0;
            redPosition = 0;
            document.getElementById('green-pos').textContent = 0;
            document.getElementById('red-pos').textContent = 0;
            document.getElementById('input-green').value = '';
            document.getElementById('input-red').value = '';
            updateBoardUI();
        }

        window.onload = createBoard;
    </script>
</body>
</html>
