        }

        /* Fun Animations */
        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-pop {
            animation: pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes bounce-subtle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .animate-bounce-subtle {
            animation: bounce-subtle 2.5s infinite ease-in-out;
        }
    </style>
</head>

                "Кушать", "Пить", "Умываться", "Обнимать", "Любить", "Веселый", "Добрый", "Красивый", "Большой", "Маленький",
                "Быстрый", "Тихий", "Теплый", "Мягкий", "Сладкий", "Вкусный", "Умный", "Смелый", "Чистый", "Яркий"
            ]
        };

        // UI Translations
        const translations = {
            ua: {
                title: "🎲 Зрозумій мене 🎈",
                subtitle: "Генератор слів для настільних ігор та розваг",
                scoreLabel: "Рахунок / Бали",
                btnGenerate: "Генерувати слово",
                footer: "Веселі слова для дітей • Настільні ігри",
                themeDark: "Темна",
                themeLight: "Світла"
            },
            ru: {
                title: "🎲 Пойми меня 🎈",
                subtitle: "Генератор слов для настольных игр и развлечений",
                scoreLabel: "Счет / Баллы",
                btnGenerate: "Сгенерировать слово",
                footer: "Веселые слова для детей • Настольные игры",
                themeDark: "Темная",
                themeLight: "Светлая"
            }
        };

        let currentLang = 'ua';
        let isDarkMode = true; // Default theme is now dark
        let score = 0;
        let lastWord = "";

        // Toggle Dark / Light Theme
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            const htmlElement = document.documentElement;
            const themeIcon = document.getElementById('theme-icon');
            const themeLabel = document.getElementById('theme-label');

            if (isDarkMode) {
                htmlElement.classList.add('dark');
                themeIcon.className = "fa-solid fa-sun text-lg text-amber-300";
                themeLabel.textContent = translations[currentLang].themeLight;
            } else {
                htmlElement.classList.remove('dark');
                themeIcon.className = "fa-solid fa-moon text-lg";
                themeLabel.textContent = translations[currentLang].themeDark;
            }

            // Re-render word card to apply theme colors
            if (lastWord) {
                renderWordCard(lastWord);
            }
        }

        // Switch Language function
        function setLanguage(lang) {
            currentLang = lang;

            const uaBtn = document.getElementById('lang-ua-btn');
            const ruBtn = document.getElementById('lang-ru-btn');
            const themeLabel = document.getElementById('theme-label');

            if (lang === 'ua') {
                uaBtn.className = "px-3.5 py-1.5 rounded-full font-bold text-xs sm:text-sm transition-all flex items-center gap-1.5 bg-amber-500 text-white shadow-sm";
                ruBtn.className = "px-3.5 py-1.5 rounded-full font-bold text-xs sm:text-sm transition-all flex items-center gap-1.5 text-gray-600 dark:text-slate-300 hover:bg-amber-100 dark:hover:bg-slate-800";
            } else {
                ruBtn.className = "px-3.5 py-1.5 rounded-full font-bold text-xs sm:text-sm transition-all flex items-center gap-1.5 bg-amber-500 text-white shadow-sm";
                uaBtn.className = "px-3.5 py-1.5 rounded-full font-bold text-xs sm:text-sm transition-all flex items-center gap-1.5 text-gray-600 dark:text-slate-300 hover:bg-amber-100 dark:hover:bg-slate-800";
            }

            // Update UI Texts
            document.getElementById('ui-title').innerHTML = translations[lang].title;
            document.getElementById('ui-subtitle').textContent = translations[lang].subtitle;
            document.getElementById('ui-score-label').textContent = translations[lang].scoreLabel;
            document.getElementById('ui-btn-generate').textContent = translations[lang].btnGenerate;
            document.getElementById('ui-footer').textContent = translations[lang].footer;
            themeLabel.textContent = isDarkMode ? translations[lang].themeLight : translations[lang].themeDark;

            // Generate a fresh word in the selected language
            generateWord();
        }

        // Change Score (+1 / -1) - Can go below 0 immediately
        function changeScore(delta) {
            score += delta;
            
            const scoreDisplay = document.getElementById('score-display');
            scoreDisplay.textContent = score;
            
            // Pop animation on score change
            scoreDisplay.classList.remove('animate-pop');
            void scoreDisplay.offsetWidth; // Reflow
            scoreDisplay.classList.add('animate-pop');
        }

        // Reset Score to 0
        function resetScore() {
            score = 0;
            document.getElementById('score-display').textContent = score;
        }

        // Light & Dark color palettes for word cards
        const lightCardThemes = [
            'bg-amber-50 border-amber-300 text-amber-950',
            'bg-sky-50 border-sky-300 text-sky-950',
            'bg-emerald-50 border-emerald-300 text-emerald-950',
            'bg-rose-50 border-rose-300 text-rose-950',
            'bg-purple-50 border-purple-300 text-purple-950',
            'bg-orange-50 border-orange-300 text-orange-950'
        ];

        const darkCardThemes = [
            'bg-amber-950/50 border-amber-500/40 text-amber-200',
            'bg-sky-950/50 border-sky-500/40 text-sky-200',
            'bg-emerald-950/50 border-emerald-500/40 text-emerald-200',
            'bg-rose-950/50 border-rose-500/40 text-rose-200',
            'bg-purple-950/50 border-purple-500/40 text-purple-200',
            'bg-orange-950/50 border-orange-500/40 text-orange-200'
        ];

        // Generate Random Word
        function generateWord() {
            const list = dictionaries[currentLang];
            let newWord = list[Math.floor(Math.random() * list.length)];

            if (list.length > 1 && newWord === lastWord) {
                newWord = list[Math.floor(Math.random() * list.length)];
            }
            lastWord = newWord;

            renderWordCard(newWord);
        }

        // Render card into container
        function renderWordCard(word) {
            const container = document.getElementById('words-container');
            container.innerHTML = '';

            const themes = isDarkMode ? darkCardThemes : lightCardThemes;
            const randomTheme = themes[Math.floor(Math.random() * themes.length)];

            const card = document.createElement('div');
            card.className = `flex flex-col items-center justify-center border-2 rounded-3xl p-6 sm:p-8 shadow-md transition-all text-center animate-pop ${randomTheme}`;

            card.innerHTML = `
                <div class="text-3xl sm:text-5xl font-black font-heading tracking-wide leading-tight drop-shadow-sm">
                    ${word}
                </div>
            `;

            container.appendChild(card);
        }

        // Initialize application on load
        window.onload = function() {
            generateWord();
        };
    </script>
</body>
</html>
