<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Palabras para Juego de Mesa</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
        }
        h1, .font-heading {
            font-family: 'Fredoka', cursive, sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 via-orange-50 to-yellow-100 min-h-screen flex flex-col justify-between p-4 sm:p-6 text-gray-800">

    <!-- Header Section -->
    <header class="text-center max-w-xl mx-auto w-full pt-2 pb-4">
        <h1 class="text-3xl sm:text-4xl font-bold text-amber-600 drop-shadow-sm flex items-center justify-center gap-2">
            <span>🎲</span> Palabras en Español <span>🇪🇸</span>
        </h1>
        <p class="text-gray-600 font-semibold text-sm sm:text-base mt-1">Generador de palabras para juego de mesa (Nivel Básico A1-A2)</p>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-xl mx-auto w-full flex-grow flex flex-col gap-6">

        <!-- Scoreboard Card -->
        <section class="bg-white rounded-3xl p-5 shadow-lg border-2 border-amber-200 flex flex-col items-center justify-between">
            <h2 class="text-xs uppercase tracking-wider font-bold text-gray-400 mb-1">Puntuación / Aciertos</h2>
            
            <div class="text-5xl font-extrabold text-amber-600 font-heading my-1" id="score-display">
                0
            </div>

            <div class="flex items-center justify-center gap-3 w-full mt-2">
                <!-- Red Button (-1 Error) -->
                <button id="btn-minus" onclick="changeScore(-1)" class="flex-1 py-3 px-4 bg-red-500 hover:bg-red-600 active:scale-95 text-white font-bold text-base sm:text-lg rounded-2xl shadow-md transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-minus"></i> -1
                </button>

                <!-- Green Button (+1 Acierto) -->
                <button id="btn-plus" onclick="changeScore(1)" class="flex-1 py-3 px-4 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold text-base sm:text-lg rounded-2xl shadow-md transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> +1
                </button>

                <!-- Reset Score Button -->
                <button onclick="resetScore()" title="Reiniciar Puntos" class="py-3 px-4 bg-gray-200 hover:bg-gray-300 active:scale-95 text-gray-700 font-bold text-lg rounded-2xl transition-all">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
            </div>
        </section>

        <!-- Generate Button Section -->
        <section class="text-center">
            <button onclick="generateWords()" class="w-full py-4 px-6 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 active:scale-95 text-white font-bold text-xl sm:text-2xl rounded-3xl shadow-xl hover:shadow-2xl transition-all border-b-4 border-orange-700 flex items-center justify-center gap-3">
                <i class="fa-solid fa-dice text-2xl sm:text-3xl"></i> Generar 6 Palabras
            </button>
        </section>

        <!-- Words List Section -->
        <section class="bg-white/80 backdrop-blur-sm rounded-3xl p-5 shadow-lg border-2 border-amber-200 flex-grow flex flex-col justify-center">
            <div id="words-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <!-- 6 Word Cards will be dynamically inserted here -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-400 mt-6 pb-2">
        Vocabulario básico en español • Juego de mesa
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Banco de más de 500 palabras cotidianas y básicas en español (A1-A2)
        const wordBank = [
            // Casa y Hogar
            "La casa", "La puerta", "La ventana", "La pared", "El suelo", "El techo", "La cocina", "El baño", "El salón",
            "El dormitorio", "La cama", "La almohada", "La manta", "La sábana", "La mesa", "La silla", "El sofá", "El sillón",
            "El armario", "El espejo", "La lámpara", "La alfombra", "La televisión", "El teléfono", "El reloj", "El cuadro",
            "La llave", "El plato", "El vaso", "La taza", "El tenedor", "El cuchillo", "La cuchara", "La servilleta", "La sartén",
            "La olla", "El horno", "El microondas", "La nevera", "El congelador", "La escoba", "El cubo", "El jabón", "La toalla",
            "El cepillo", "La pasta de dientes", "El champú", "El papel higiénico", "El grifo", "La ducha", "La bañera", "El balcón",
            "El jardín", "El garaje", "El timbre", "La radio", "El ordenador", "El teclado", "El ratón", "El cargador",

            // Comida y Bebida
            "El agua", "El pan", "El café", "El té", "La leche", "El queso", "El huevo", "La carne", "El pollo", "El pescado",
            "El arroz", "La pasta", "La sopa", "La ensalada", "La fruta", "La manzana", "El plátano", "La naranja", "El limón",
            "La fresa", "La uva", "La piña", "El melocotón", "La verdura", "La patata", "El tomate", "La cebolla", "El ajo",
            "La zanahoria", "El pepino", "La lechuga", "La pimienta", "La sal", "El azúcar", "El aceite", "El vinagre",
            "La mantequilla", "La mermelada", "El miel", "El chocolate", "El pastel", "La galleta", "El helado", "El jugo",
            "La cerveza", "El vino", "La pizza", "La hamburguesa", "El bocadillo", "Las patatas fritas", "El arroz con leche",

            // Ropa y Accesorios
            "La ropa", "La camiseta", "La camisa", "Los pantalones", "Los vaqueros", "El vestido", "La falda", "El abrigo",
            "La chaqueta", "El jersey", "El sudadera", "Los zapatos", "Las zapatillas", "Las botas", "Los calcetines",
            "La ropa interior", "El pijama", "El sombrero", "La gorra", "El bufanda", "Los guantes", "El cinturón", "El reloj",
            "Las gafas", "Las gafas de sol", "El bolso", "La mochila", "La billetera", "El paraguas", "El anillo", "El collar",

            // Persona y Cuerpo
            "La persona", "El hombre", "La mujer", "El niño", "La niña", "El bebé", "El amigo", "La amiga", "La familia",
            "El padre", "La madre", "El hijo", "La hija", "El hermano", "La hermana", "El abuelo", "La abuela", "El tío",
            "La tía", "El primo", "La prima", "El vecino", "La cabeza", "El pelo", "La cara", "El ojo", "La nariz",
            "La boca", "El diente", "La lengua", "La oreja", "El cuello", "El hombro", "El brazo", "La mano", "El dedo",
            "El pecho", "La espalda", "El estómago", "La pierna", "La rodilla", "El pie", "El corazón", "La sangre",

            // Ciudad, Transporte y Lugares
            "La ciudad", "El pueblo", "La calle", "La avenida", "La plaza", "El parque", "El edificio", "El rascacielos",
            "La tienda", "El supermercado", "El mercado", "El centro comercial", "El restaurante", "El bar", "La cafetería",
            "El hotel", "El banco", "El hospital", "La farmacia", "La escuela", "El colegio", "La universidad", "La biblioteca",
            "El museo", "El cine", "El teatro", "La estación", "El aeropuerto", "La parada", "El coche", "El autobús",
            "El tren", "El metro", "El tranvía", "La bicicleta", "La moto", "El taxi", "El avión", "El barco",
            "El semáforo", "El puente", "El camino", "El tráfico", "El billete", "El pasaporte", "El mapa",

            // Naturaleza y Tiempo Atmosférico
            "El sol", "La luna", "La estrella", "El cielo", "La nube", "La lluvia", "La nieve", "El viento",
            "El aire", "El fuego", "La tierra", "El mar", "El océano", "El río", "El lago", "La playa",
            "La montaña", "El bosque", "El árbol", "La flor", "La planta", "La hierba", "La isla", "El campo",
            "El calor", "El frío", "El tiempo", "El clima", "La tormenta", "El arcoíris", "El hielo",

            // Animales
            "El perro", "El gato", "El pájaro", "El pez", "El caballo", "La vaca", "El cerdo", "La oveja",
            "La cabra", "El ratón", "El león", "El tigre", "El elefante", "El oso", "El mono", "El conejo",
            "El pato", "El pollo", "La gallina", "El gallo", "La serpiente", "La rana", "La araña", "La mosca",
            "El mosquito", "La mariposa", "La abeja", "El delfín", "La ballena", "El tiburón",

            // Tiempo y Calendario
            "El día", "La noche", "La mañana", "La tarde", "La madrugada", "Hoy", "Ayer", "Mañana",
            "El segundo", "El minuto", "La hora", "La semana", "El mes", "El año", "El siglo", "El fin de semana",
            "El lunes", "El martes", "El miércoles", "El jueves", "El viernes", "El sábado", "El domingo",
            "La primavera", "El verano", "El otoño", "El invierno", "El cumpleaños", "La fiesta", "Las vacaciones",

            // Objetos Escolares, Trabajo y Tecnología
            "El libro", "El cuaderno", "El lápiz", "El bolígrafo", "La goma", "La regla", "Las tijeras", "El papel",
            "La carta", "El sobre", "El periódico", "La revista", "La foto", "La cámara", "La pantalla", "La batería",
            "El mensaje", "El correo", "La red", "La página", "El juego", "La música", "La canción", "La película",
            "El dinero", "El euro", "El dólar", "La tarjeta", "La cuenta", "El precio", "La factura", "El regalo",

            // Acciones y Verbos Básicos (Sustantivados o en Infinitivo)
            "Comer", "Beber", "Dormir", "Hablar", "Escuchar", "Leer", "Escribir", "Caminar", "Correr", "Nadar",
            "Jugar", "Trabajar", "Estudiar", "Comprar", "Vender", "Cocinar", "Limpiar", "Lavar", "Mirar", "Ver",
            "Abrir", "Cerrar", "Viajar", "Cantar", "Bailar", "Conducir", "Pintar", "Ayudar", "Buscar", "Encontrar",
            "Pensar", "Aprender", "Entender", "Sonreír", "Vivir", "Pagar", "Llamar", "Preguntar", "Responder",

            // Calificativos y Adjetivos Cotidianos
            "Grande", "Pequeño", "Bueno", "Malo", "Bonito", "Feo", "Nuevo", "Viejo", "Joven", "Fácil",
            "Difícil", "Rápido", "Lento", "Alto", "Bajo", "Caliente", "Frío", "Limpio", "Sucio", "Feliz",
            "Triste", "Cansado", "Enfermo", "Abierto", "Cerrado", "Lleno", "Vacío", "Caro", "Barato", "Rico",

            // Colores y Formas
            "Rojo", "Azul", "Verde", "Amarillo", "Blanco", "Negro", "Gris", "Rosa", "Naranja", "Marrón",
            "Morado", "El círculo", "El cuadrado", "El triángulo", "La línea", "El punto",

            // Conceptos y Palabras Variadas A1-A2
            "El nombre", "La palabra", "La pregunta", "La respuesta", "La verdad", "La mentira", "La idea", "El problema",
            "La solución", "El número", "La parte", "El todo", "El principio", "El final", "La salud", "La suerte",
            "La paz", "El peligro", "La libertad", "El silencio", "El ruido", "La voz", "El olor", "El sabor"
        ];

        let score = 0;

        // Cambiar puntuación
        function changeScore(delta) {
            score += delta;
            if (score < 0) score = 0; // Evitar puntos negativos
            document.getElementById('score-display').textContent = score;
        }

        // Reiniciar puntuación
        function resetScore() {
            score = 0;
            document.getElementById('score-display').textContent = score;
        }

        // Generar 6 palabras aleatorias
        function generateWords() {
            const container = document.getElementById('words-container');
            container.innerHTML = '';

            // Mezclar el arreglo y obtener los primeros 6 elementos
            const shuffled = [...wordBank].sort(() => 0.5 - Math.random());
            const selectedWords = shuffled.slice(0, 6);

            // Crear y mostrar tarjeta para cada palabra
            selectedWords.forEach((word, index) => {
                const card = document.createElement('div');
                card.className = "flex items-center bg-amber-50/80 border border-amber-200 rounded-2xl p-4 shadow-sm hover:shadow-md transition-all";

                card.innerHTML = `
                    <div class="flex-shrink-0 w-9 h-9 rounded-full bg-amber-500 text-white font-bold flex items-center justify-center mr-3 font-heading text-lg shadow-sm">
                        ${index + 1}
                    </div>
                    <div class="overflow-hidden">
                        <div class="text-lg font-bold text-gray-800 capitalize leading-tight">
                            ${word}
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // Generar palabras al cargar la página
        window.onload = function() {
            generateWords();
        };
    </script>
</body>
</html>
