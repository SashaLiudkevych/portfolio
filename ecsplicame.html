<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Palabras para Juego de Mesa</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
        }
        h1, .font-heading {
            font-family: 'Fredoka', cursive, sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 via-orange-50 to-yellow-100 min-h-screen flex flex-col justify-between p-4 sm:p-6 text-gray-800">

    <!-- Header Section -->
    <header class="text-center max-w-xl mx-auto w-full pt-2 pb-4">
        <h1 class="text-3xl sm:text-4xl font-bold text-amber-600 drop-shadow-sm flex items-center justify-center gap-2">
            <span>🎲</span> Palabras en Español <span>🇪🇸</span>
        </h1>
        <p class="text-gray-600 font-semibold text-sm sm:text-base mt-1">Generador de palabras para juego de mesa (Nivel Básico A1-A2)</p>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-xl mx-auto w-full flex-grow flex flex-col gap-6">

        <!-- Scoreboard Card -->
        <section class="bg-white rounded-3xl p-5 shadow-lg border-2 border-amber-200 flex flex-col items-center justify-between">
            <h2 class="text-xs uppercase tracking-wider font-bold text-gray-400 mb-1">Puntuación / Aciertos</h2>
            
            <div class="text-5xl font-extrabold text-amber-600 font-heading my-1" id="score-display">
                0
            </div>

            <div class="flex items-center justify-center gap-3 w-full mt-2">
                <!-- Red Button (-1 Error) -->
                <button id="btn-minus" onclick="changeScore(-1)" class="flex-1 py-3 px-4 bg-red-500 hover:bg-red-600 active:scale-95 text-white font-bold text-base sm:text-lg rounded-2xl shadow-md transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-minus"></i> -1
                </button>

                <!-- Green Button (+1 Acierto) -->
                <button id="btn-plus" onclick="changeScore(1)" class="flex-1 py-3 px-4 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold text-base sm:text-lg rounded-2xl shadow-md transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> +1
                </button>

                <!-- Reset Score Button -->
                <button onclick="resetScore()" title="Reiniciar Puntos" class="py-3 px-4 bg-gray-200 hover:bg-gray-300 active:scale-95 text-gray-700 font-bold text-lg rounded-2xl transition-all">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
            </div>
        </section>

        <!-- Generate Button Section -->
        <section class="text-center">
            <button onclick="generateWords()" class="w-full py-4 px-6 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 active:scale-95 text-white font-bold text-xl sm:text-2xl rounded-3xl shadow-xl hover:shadow-2xl transition-all border-b-4 border-orange-700 flex items-center justify-center gap-3">
                <i class="fa-solid fa-dice text-2xl sm:text-3xl"></i> Generar 6 Palabras
            </button>
        </section>

        <!-- Words List Section -->
        <section class="bg-white/80 backdrop-blur-sm rounded-3xl p-5 shadow-lg border-2 border-amber-200 flex-grow flex flex-col justify-center">
            <div id="words-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <!-- 6 Word Cards will be dynamically inserted here -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-400 mt-6 pb-2">
        Vocabulario básico en español • Juego de mesa
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Vocabulario cotidiano y básico en español
        const wordBank = [
            "La casa", "El agua", "El gato", "El perro", "El pan", 
            "La mesa", "La silla", "La comida", "El coche", "La puerta", 
            "La ventana", "El libro", "La cama", "La luz", "El teléfono", 
            "El café", "El té", "La leche", "La fruta", "El queso", 
            "El plato", "El vaso", "La cocina", "El baño", "La ropa", 
            "Los zapatos", "El dinero", "La tienda", "El amigo", "La familia", 
            "El sol", "La luna", "El día", "La noche", "La hora", 
            "El juego", "La calle", "La ciudad", "El trabajo", "La llave"
        ];

        let score = 0;

        // Cambiar puntuación
        function changeScore(delta) {
            score += delta;
            if (score < 0) score = 0; // Evitar puntos negativos
            document.getElementById('score-display').textContent = score;
        }

        // Reiniciar puntuación
        function resetScore() {
            score = 0;
            document.getElementById('score-display').textContent = score;
        }

        // Generar 6 palabras aleatorias
        function generateWords() {
            const container = document.getElementById('words-container');
            container.innerHTML = '';

            // Mezclar el arreglo y obtener los primeros 6 elementos
            const shuffled = [...wordBank].sort(() => 0.5 - Math.random());
            const selectedWords = shuffled.slice(0, 6);

            // Crear y mostrar tarjeta para cada palabra
            selectedWords.forEach((word, index) => {
                const card = document.createElement('div');
                card.className = "flex items-center bg-amber-50/80 border border-amber-200 rounded-2xl p-4 shadow-sm hover:shadow-md transition-all";

                card.innerHTML = `
                    <div class="flex-shrink-0 w-9 h-9 rounded-full bg-amber-500 text-white font-bold flex items-center justify-center mr-3 font-heading text-lg shadow-sm">
                        ${index + 1}
                    </div>
                    <div class="overflow-hidden">
                        <div class="text-lg font-bold text-gray-800 capitalize leading-tight">
                            ${word}
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // Generar palabras al cargar la página
        window.onload = function() {
            generateWords();
        };
    </script>
</body>
</html>
